services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab21-story-api
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      PORT: "3001"
      LOG_LEVEL: info
    volumes:
      - story_images:/app/generated-images
      - story_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lab21-story-client
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  story_images:
  story_logs:
