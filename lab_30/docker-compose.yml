services:
  mysql:
    image: mysql:8.4
    container_name: lab30-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: car_owners
      MYSQL_USER: lab30
      MYSQL_PASSWORD: lab30pass
    ports:
      - "3306:3306"
    volumes:
      - lab30_mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  lab30_mysql_data:
