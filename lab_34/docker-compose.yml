services:
  web-agent:
    image: doctordocker88/lab-34-web-agent:latest
    container_name: lab34-web-agent
    ports:
      - "3400:3400"
    env_file:
      - .env
    environment:
      PORT: "3400"
      LOG_LEVEL: info
    volumes:
      - lab34_logs:/app/logs
    restart: unless-stopped
    pull_policy: always
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3400/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  lab34_logs:
